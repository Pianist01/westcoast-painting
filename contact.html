<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Steven Peralta">
  <meta name="description" content="If you are interested in getting a free estimate, or want more informaiton, feel free to contact us!">
  <link rel="stylesheet" href="contact.css">
  <title>Contact Page</title>
</head>
<body>

  <section class="hero-section">
        <header>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li>About Us</li>
                <li>Contact Us</li>
            </ul>
        </header>

        <div class="hero-content">
            <h1>Our Story</h1>
        </div>
    </section>

    <main>
      <div class="contact-box">
        <h1>Contact Our Team</h1>
        <p>If you have any questions about services we offer and/or you'd like a free estimate, send us a message and we will respond as soon as possible!</p>

        <form id="contact-form">
          <div class="form-row1">
            <label>First Name</label>
            <input class="form-input" id="contact-first-name" type="text" name="from_firstname" placeholder="First Name *" required>
          </div>

          <div class="form-row2">
            <label>Last Name</label>
            <input class="form-input" id="contact-last-name" type="text" name="from_lastname" placeholder="Last Name *" required> 
          </div>

          <div class="form-row3">
            <label>Email</label>
            <input class="form-input" id="contact-form-email" type="email" name="from_email" placeholder="Email *" required>
          </div>
        </form>
      </div>
    </main>
  
</body>
</html>
